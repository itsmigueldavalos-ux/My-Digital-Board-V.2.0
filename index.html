<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Digital Board 2.0</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      :root{
        --bg:#0b1020;
        --muted:rgba(255,255,255,.65);
        --text:rgba(255,255,255,.92);
        --border:rgba(255,255,255,.12);
        --shadow:0 10px 25px rgba(0,0,0,.35);
      }
      *{box-sizing:border-box}
      body{
        margin:0;
        font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
        background:radial-gradient(1200px 700px at 20% 0%, #15204a 0%, var(--bg) 55%);
        color:var(--text);
      }
      .wrap{max-width:1500px;margin:0 auto;padding:20px}

      .topbar{
        display:grid;
        grid-template-columns:1fr auto 1fr;
        gap:12px;
        align-items:center;
        padding:14px 16px;
        border:1px solid var(--border);
        border-radius:16px;
        background:rgba(18,26,51,.78);
        box-shadow:var(--shadow);
        backdrop-filter:blur(8px);
      }
      .leftPanel{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
      .boardToggle{width:360px;max-width:100%}
      .metaLeft{
        font-size:12px;color:var(--muted);
        display:flex;gap:14px;flex-wrap:wrap;align-items:center;min-width:0;
      }
      .titleCenter{
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:6px;text-align:center;
      }
      .titleCenter h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
      .todayLine{
        font-size:14px;opacity:.86;
        display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
      }
      .clockSep{opacity:.55}

      .rightPanel{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
      .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .hcLine{
        font-size:15px;color:rgba(255,255,255,.90);
        display:flex;align-items:center;gap:8px;user-select:none;letter-spacing:.2px;
      }

      input,select,button{
        border:1px solid var(--border);
        background:rgba(255,255,255,.06);
        color:var(--text);
        border-radius:12px;
        padding:10px 12px;
        font-size:14px;
        outline:none;
      }
      button{cursor:pointer}
      button.primary{background:rgba(29,185,84,.15);border-color:rgba(29,185,84,.35)}
      button.lock{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35)}
      button.lock.active{background:rgba(255,77,77,.14);border-color:rgba(255,77,77,.35)}
      .smallBtn{padding:6px 10px;font-size:12px;border-radius:10px}

      .board{
        margin-top:14px;
        display:grid;
        grid-template-columns:repeat(5,1fr);
        gap:12px;
      }
      @media(max-width:1180px){.board{grid-template-columns:repeat(2,1fr)}}
      @media(max-width:560px){
        .topbar{grid-template-columns:1fr}
        .rightPanel{align-items:flex-start}
        .controls{justify-content:flex-start}
        .boardToggle{width:100%}
        .board{grid-template-columns:1fr}
      }

      .col{
        border:1px solid var(--border);
        border-radius:16px;
        background:rgba(18,26,51,.65);
        box-shadow:var(--shadow);
        min-height:420px;
        display:flex;flex-direction:column;overflow:hidden;
      }
      .colHeader{
        padding:12px 12px 10px 12px;
        border-bottom:1px solid var(--border);
        display:flex;align-items:center;justify-content:space-between;gap:10px;
      }
      .colHeader h2{margin:0;font-size:14px;letter-spacing:.2px}
      .colHeader span{font-size:12px;color:var(--muted)}

      .dropZone{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
      .hint{
        font-size:12px;color:rgba(255,255,255,.55);
        border:1px dashed rgba(255,255,255,.18);
        border-radius:14px;
        padding:10px 12px;
        min-height:26px;
      }
      .dragOver{
        outline:2px solid rgba(255,255,255,.22);
        outline-offset:-2px;
        background:rgba(255,255,255,.04);
      }

      .subsection{
        border:1px solid rgba(255,255,255,.10);
        border-radius:14px;
        overflow:hidden;
        background:rgba(255,255,255,.03);
      }
      .subHeader{
        padding:10px 12px;
        border-bottom:1px solid rgba(255,255,255,.10);
        display:flex;align-items:center;justify-content:space-between;
        font-size:13px;
      }
      .subHeader b{font-size:13px}
      .subHeader span{font-size:12px;color:rgba(255,255,255,.65)}
      .subBody{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:80px}

      /* Column select toggle (like board toggle) */
      .colToggleWrap{padding:0 12px 12px 12px}
      .colToggle{width:100%;max-width:100%}

      .card{
        border:1px solid var(--border);
        border-radius:16px;
        padding:12px;
        background:rgba(255,255,255,.06);
        box-shadow:0 8px 18px rgba(0,0,0,.25);
        position:relative;
        transform-origin:center;
      }
      .card.flipped{
        transform:rotate(180deg);
      }

      .cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

      .photoSlot{
        width:44px;height:44px;border-radius:12px;
        border:1px solid rgba(255,255,255,.18);
        background:rgba(255,255,255,.05);
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;flex:0 0 auto;position:relative;
      }
      .photoSlot img{width:100%;height:100%;object-fit:cover;display:block}
      .photoBtn{
        width:100%;height:100%;
        display:flex;align-items:center;justify-content:center;
        font-size:11px;color:rgba(255,255,255,.75);
        cursor:pointer;user-select:none;line-height:1.1;text-align:center;padding:6px;
      }
      .fileInput{
        position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;
      }

      .name{font-weight:700;font-size:14px;margin:0}
      .subline{font-size:13px;color:rgba(255,255,255,.82);margin-top:6px}

      .statusRow{
        margin-top:8px;
        display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      }
      .pill{
        display:inline-flex;align-items:center;gap:6px;
        padding:4px 10px;border-radius:999px;
        border:1px solid rgba(255,255,255,.18);
        background:rgba(255,255,255,.06);
        font-size:12px;color:rgba(255,255,255,.88);user-select:none;
      }
      .pill.in{border-color:rgba(29,185,84,.45);background:rgba(29,185,84,.12)}
      .pill.out{border-color:rgba(255,77,77,.45);background:rgba(255,77,77,.10)}

      .toast{
        position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
        padding:10px 12px;border-radius:14px;
        border:1px solid rgba(255,255,255,.18);
        background:rgba(18,26,51,.9);
        box-shadow:0 14px 30px rgba(0,0,0,.4);
        font-size:13px;color:rgba(255,255,255,.9);max-width:92vw;
      }

      .modalBack{
        position:fixed;inset:0;background:rgba(0,0,0,.55);
        display:flex;align-items:center;justify-content:center;padding:18px;
      }
      .modal{
        width:100%;max-width:560px;
        border:1px solid rgba(255,255,255,.18);
        border-radius:18px;
        background:rgba(18,26,51,.95);
        box-shadow:0 18px 40px rgba(0,0,0,.55);
        padding:14px;
      }
      .modal h3{margin:0 0 10px 0;font-size:15px}
      .modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
      .modalNote{font-size:12px;color:rgba(255,255,255,.65);margin-top:8px;line-height:1.35}

      .courseTitle{font-weight:800;font-size:14px;margin:0}
      .termLine{font-size:13px;color:rgba(255,255,255,.82);margin-top:6px}

      .assignMetaRow{
        margin-top:10px;
        display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      }
      .assignMetaRow select{padding:6px 10px;font-size:12px;border-radius:10px}

      .courseActionsRow{
        display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;
      }
      .dangerBtn{
        background:rgba(255,77,77,.12);
        border-color:rgba(255,77,77,.35);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      /***********************
       * IndexedDB for Photos
       ***********************/
      const PHOTO_DB = "mdb2_photos_v1";
      const PHOTO_STORE = "photos";

      function openPhotoDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(PHOTO_DB, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(PHOTO_STORE)) {
              db.createObjectStore(PHOTO_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbSet(key, blob) {
        const db = await openPhotoDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(PHOTO_STORE, "readwrite");
          tx.objectStore(PHOTO_STORE).put(blob, key);
          tx.oncomplete = () => { db.close(); resolve(true); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        });
      }

      async function idbGet(key) {
        const db = await openPhotoDB();
        return new Promise((resolve) => {
          const tx = db.transaction(PHOTO_STORE, "readonly");
          const req = tx.objectStore(PHOTO_STORE).get(key);
          req.onsuccess = () => { const v = req.result || null; db.close(); resolve(v); };
          req.onerror = () => { db.close(); resolve(null); };
        });
      }

      function fileToBlob(file) {
        return new Promise((resolve, reject) => {
          try {
            resolve(new Blob([file], { type: file.type || "application/octet-stream" }));
          } catch (e) {
            reject(e);
          }
        });
      }

      /***********************
       * Board Definitions
       ***********************/
      // ✅ Amazon columns (5)
      const AMAZON_COLS = [
        {
          key: "stow",
          title: "STOW",
          toggleKey: "sel_stow",
          options: [
            { key: "stow_pg", title: "Decanter/Process Guide" },
            { key: "stow_pa", title: "Pallet Auditor" },
            { key: "stow_down", title: "Downstacker" },
            { key: "stow_stower", title: "Stower (To Stow)" },
            { key: "stow_trans", title: "Stow Transporter" },
          ],
        },
        {
          key: "pick",
          title: "PICK",
          toggleKey: "sel_pick",
          options: [
            { key: "pick_pg", title: "Process Guide/Loading Picks" },
            { key: "pick_pt", title: "8ft-6ft Pallet Transfer" },
            { key: "pick_picker", title: "Picker (To Pick)" },
            { key: "pick_trans", title: "Pick Transporter" },
          ],
        },
        {
          key: "ls",
          title: "LaborShare",
          toggleKey: "sel_ls",
          options: [
            { key: "ls_in_ps", title: "XLX7 Inbound Problem Solve" },
            { key: "ls_out_ps", title: "XLX7 Outbound Problem Solve" },
            { key: "ls_ws", title: "XLX7 WaterSpider" },
          ],
        },
        {
          key: "ps",
          title: "PS",
          toggleKey: "sel_ps",
          options: [
            { key: "ps_qxy2", title: "QXY2 Problem Solve" },
            { key: "ps_icqa_iol", title: "ICQA IOL" },
            { key: "ps_icqa_bc", title: "ICQA Bin Counter" },
          ],
        },
        { key: "exp", title: "Expected Employee", dropKey: "staff_expected" },
      ];

      // ✅ SNHU columns (4): My Class Schedule + Current Assignments + Current Term + Upcoming Term sections inside schedule
      const SNHU_COLS = [
        { key: "sched", title: "My Class Schedule", kind: "schedule" },
        { key: "assign", title: "Current Assignments", kind: "assignments" },
      ];

      const WEEK_OPTIONS = ["Week 1","Week 2","Week 3","Week 4","Week 5","Week 6","Week 7","Week 8"];
      const PROGRESS_OPTIONS = ["Not Started","In Progress"];

      const todayStr = () => {
        const d = new Date();
        return d.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" });
      };
      const liveClockStr = () => new Date().toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit", second:"2-digit" });
      const nowStamp = () => new Date().toLocaleString();

      function safeParse(json, fallback) { try { return JSON.parse(json); } catch { return fallback; } }

      function App() {
        const loginName = "migudavc";

        const [activeBoard, setActiveBoard] = useState("amazon");
        const [lastUpdated, setLastUpdated] = useState(() => localStorage.getItem("swb_lastUpdated") || nowStamp());
        const [toast, setToast] = useState("");

        const [liveTime, setLiveTime] = useState(() => liveClockStr());
        useEffect(() => {
          const t = setInterval(() => setLiveTime(liveClockStr()), 1000);
          return () => clearInterval(t);
        }, []);

        // Lock
        const lockKey = useMemo(() => `swb_locked_${loginName}`, [loginName]);
        const [isLocked, setIsLocked] = useState(() => localStorage.getItem(lockKey) === "1");
        const [unlockModalOpen, setUnlockModalOpen] = useState(false);

        // Storage
        const storageKey = useMemo(() => `swb_state_${loginName}`, [loginName]);
        const [state, setState] = useState(() => {
          const raw = localStorage.getItem(storageKey);
          return raw ? safeParse(raw, null) : null;
        });

        // ✅ Amazon column selects (persisted)
        const [selStow, setSelStow] = useState(() => localStorage.getItem("sel_stow") || "stow_pg");
        const [selPick, setSelPick] = useState(() => localStorage.getItem("sel_pick") || "pick_pg");
        const [selLS, setSelLS] = useState(() => localStorage.getItem("sel_ls") || "ls_in_ps");
        const [selPS, setSelPS] = useState(() => localStorage.getItem("sel_ps") || "ps_qxy2");
        useEffect(() => localStorage.setItem("sel_stow", selStow), [selStow]);
        useEffect(() => localStorage.setItem("sel_pick", selPick), [selPick]);
        useEffect(() => localStorage.setItem("sel_ls", selLS), [selLS]);
        useEffect(() => localStorage.setItem("sel_ps", selPS), [selPS]);

        // ✅ SNHU Week select (like board toggle)
        const [weekFilter, setWeekFilter] = useState(() => localStorage.getItem("snhu_week_filter") || "Week 1");
        useEffect(() => localStorage.setItem("snhu_week_filter", weekFilter), [weekFilter]);

        // ✅ SNHU: Add Course modal
        const [addCourseOpen, setAddCourseOpen] = useState(false);
        const [cTitle, setCTitle] = useState("");
        const [cTerm, setCTerm] = useState("Current Term"); // Current Term | Upcoming Term

        // ✅ SNHU: Delete Course modal
        const [delCourseOpen, setDelCourseOpen] = useState(false);
        const [delCourseId, setDelCourseId] = useState("");

        // ✅ SNHU: Add Assignment modal (still)
        const [addAssignOpen, setAddAssignOpen] = useState(false);
        const [aTitle, setATitle] = useState("");
        const [aCourse, setACourse] = useState("");
        const [aTerm, setATerm] = useState("");
        const [aDue, setADue] = useState("");

        function showToast(msg) {
          setToast(msg);
          window.clearTimeout(showToast._t);
          showToast._t = window.setTimeout(() => setToast(""), 1800);
        }

        // ✅ Fixed ID so photo persists forever
        function miguelCard() {
          return {
            id: "staff-migudavc",
            personName: "Miguel A Davalos",
            login: "migudavc",
            shiftCoHost: "DB3T0700",
            shiftPattern: "Back Half Days",
            col: "staff_expected", // Expected Employee default
            presence: "IN",        // IN | OUT
            createdBy: "migudavc",
            createdAt: new Date().toISOString(),
          };
        }

        function defaultState() {
          return {
            staffing: { cards: [miguelCard()] },
            snhu: {
              // ✅ No default courses or assignments
              courses: [],
              assignments: [],
            },
          };
        }

        // Normalize / migrate Amazon col keys to only allowed ones
        function amazonValidCols() {
          const s = new Set(["staff_expected"]);
          for (const col of AMAZON_COLS) {
            if (col.options) for (const o of col.options) s.add(o.key);
            if (col.dropKey) s.add(col.dropKey);
          }
          return s;
        }

        function migrateAmazonCol(oldCol) {
          const valid = amazonValidCols();
          if (valid.has(oldCol)) return oldCol;

          // If an old key matches earlier builds, drop to Expected Employee
          return "staff_expected";
        }

        // SNHU migrations
        function migrateSnhuTerm(oldTerm) {
          return oldTerm === "Upcoming Term" ? "Upcoming Term" : "Current Term";
        }
        function migrateSnhuWeek(w) {
          return WEEK_OPTIONS.includes(w) ? w : "Week 1";
        }
        function migrateSnhuProgress(p) {
          return PROGRESS_OPTIONS.includes(p) ? p : "Not Started";
        }

        // Load state + ensure Miguel exists + rehydrate photo presence from IndexedDB (via URL)
        useEffect(() => {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? safeParse(raw, defaultState()) : defaultState();

          // Staffing
          parsed.staffing = parsed.staffing || { cards: [] };
          parsed.staffing.cards = Array.isArray(parsed.staffing.cards) ? parsed.staffing.cards : [];
          parsed.staffing.cards = parsed.staffing.cards.map((c) => ({
            ...c,
            col: migrateAmazonCol(c.col),
            presence: (c.presence === "OUT" ? "OUT" : "IN"),
          }));

          const hasMiguel = parsed.staffing.cards.some((c) => c && c.id === "staff-migudavc");
          if (!hasMiguel) parsed.staffing.cards = [miguelCard(), ...parsed.staffing.cards];

          // SNHU
          parsed.snhu = parsed.snhu || { courses: [], assignments: [] };
          parsed.snhu.courses = Array.isArray(parsed.snhu.courses) ? parsed.snhu.courses : [];
          parsed.snhu.assignments = Array.isArray(parsed.snhu.assignments) ? parsed.snhu.assignments : [];

          parsed.snhu.courses = parsed.snhu.courses.map((c) => ({
            ...c,
            termBucket: migrateSnhuTerm(c.termBucket),
          }));

          parsed.snhu.assignments = parsed.snhu.assignments.map((a) => ({
            ...a,
            week: migrateSnhuWeek(a.week),
            progress: migrateSnhuProgress(a.progress),
          }));

          setState(parsed);

          // Rehydrate photo URLs (from IndexedDB)
          (async () => {
            try {
              const blob = await idbGet("photo:staff-migudavc");
              if (blob) {
                const url = URL.createObjectURL(blob);
                // store temp runtime url on window cache; actual data is in IndexedDB
                window.__photoUrlCache = window.__photoUrlCache || {};
                window.__photoUrlCache["staff-migudavc"] = url;
              }
            } catch {
              // ignore
            }
          })();
        }, [storageKey]);

        function touchUpdate(nextState) {
          setState(nextState);
          const stamp = nowStamp();
          setLastUpdated(stamp);
          localStorage.setItem("swb_lastUpdated", stamp);
          localStorage.setItem(storageKey, JSON.stringify(nextState));
        }

        useEffect(() => {
          localStorage.setItem(lockKey, isLocked ? "1" : "0");
        }, [isLocked, lockKey]);

        function lockNow() { setIsLocked(true); showToast("Board locked."); }
        function requestUnlock() { setUnlockModalOpen(true); }
        function unlockNow() { setIsLocked(false); setUnlockModalOpen(false); showToast("Board unlocked."); }

        // ✅ HC counts only IN on Amazon; hidden entirely on SNHU
        const hc = useMemo(() => (state?.staffing?.cards || []).filter(c => (c?.presence || "IN") === "IN").length, [state]);

        // SNHU: open modals
        function openAddCourse() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          setCTitle(""); setCTerm("Current Term");
          setAddCourseOpen(true);
        }
        function openDeleteCourse() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          const list = state?.snhu?.courses || [];
          if (!list.length) { showToast("No courses to delete."); return; }
          setDelCourseId(list[0].id);
          setDelCourseOpen(true);
        }

        function saveCourse() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          const t = cTitle.trim();
          if (!t) { showToast("Enter a course name."); return; }
          const course = {
            id: "course-" + Math.random().toString(16).slice(2),
            title: t,
            termBucket: cTerm === "Upcoming Term" ? "Upcoming Term" : "Current Term",
            createdAt: new Date().toISOString(),
          };
          const next = {
            ...state,
            snhu: {
              ...state.snhu,
              courses: [course, ...(state.snhu.courses || [])],
            },
          };
          touchUpdate(next);
          setAddCourseOpen(false);
          showToast("Course added.");
        }

        function deleteCourseNow() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          const nextCourses = (state.snhu.courses || []).filter(c => c.id !== delCourseId);
          const next = { ...state, snhu: { ...state.snhu, courses: nextCourses } };
          touchUpdate(next);
          setDelCourseOpen(false);
          showToast("Course deleted.");
        }

        function openAddAssignment() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          setATitle(""); setACourse(""); setATerm(""); setADue("");
          setAddAssignOpen(true);
        }

        function saveAssignment() {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          const t = aTitle.trim();
          const c = aCourse.trim();
          const tm = aTerm.trim();
          if (!t || !c || !tm) { showToast("Fill in Title, Course, and Term."); return; }

          const assign = {
            id: "asn-" + Math.random().toString(16).slice(2),
            title: t,
            course: c,
            term: tm,
            dueDate: aDue ? new Date(aDue).toISOString() : null,
            week: weekFilter,
            progress: "Not Started",
            createdAt: new Date().toISOString(),
          };
          const next = {
            ...state,
            snhu: { ...state.snhu, assignments: [assign, ...(state.snhu.assignments || [])] }
          };
          touchUpdate(next);
          setAddAssignOpen(false);
          showToast("Assignment added.");
        }

        // Amazon: update staffing card
        function updateStaffCard(id, patch) {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          const nextCards = (state.staffing.cards || []).map(c => (c.id === id ? { ...c, ...patch } : c));
          touchUpdate({ ...state, staffing: { ...state.staffing, cards: nextCards } });
        }

        // Amazon: move staffing card
        function moveStaffCard(cardId, newCol) {
          updateStaffCard(cardId, { col: newCol });
        }

        // Photo: set / persist in IndexedDB
        async function setMiguelPhoto(file) {
          if (isLocked) { showToast("Locked. Unlock to edit."); return; }
          if (!file) return;
          if (!file.type || !file.type.startsWith("image/")) { showToast("Please select an image file."); return; }
          if (file.size > 4_000_000) { showToast("Image too large (max 4MB)."); return; }

          try {
            const blob = await fileToBlob(file);
            await idbSet("photo:staff-migudavc", blob);
            const url = URL.createObjectURL(blob);
            window.__photoUrlCache = window.__photoUrlCache || {};
            window.__photoUrlCache["staff-migudavc"] = url;
            showToast("Photo saved.");
            // no need to touchUpdate; photo is external to localStorage now
          } catch {
            showToast("Could not save photo.");
          }
        }

        if (!state) return null;

        return (
          <div className="wrap">
            <div className="topbar">
              <div className="leftPanel">
                <select className="boardToggle" value={activeBoard} onChange={(e) => setActiveBoard(e.target.value)}>
                  <option value="amazon">Amazon Workplace: Demorians Department</option>
                  <option value="snhu">Southern New Hampshire University (SNHU)</option>
                </select>
                <div className="metaLeft">
                  <span><strong>Last Updated:</strong> {lastUpdated}</span>
                </div>
              </div>

              <div className="titleCenter">
                <h1>My Digital Board 2.0</h1>
                <div className="todayLine">
                  {todayStr()} <span className="clockSep">•</span> {liveTime}
                </div>
              </div>

              <div className="rightPanel">
                <div className="controls">
                  {isLocked ? (
                    <button className="lock active smallBtn" onClick={requestUnlock}>Unlock</button>
                  ) : (
                    <button className="lock smallBtn" onClick={lockNow}>Lock</button>
                  )}
                </div>

                {/* ✅ Remove HC from SNHU board only */}
                {activeBoard === "amazon" ? (
                  <div className="hcLine"><strong>HC:</strong>&nbsp;{hc}</div>
                ) : null}
              </div>
            </div>

            {activeBoard === "amazon" ? (
              <AmazonBoard
                state={state}
                isLocked={isLocked}
                showToast={showToast}
                selStow={selStow} setSelStow={setSelStow}
                selPick={selPick} setSelPick={setSelPick}
                selLS={selLS} setSelLS={setSelLS}
                selPS={selPS} setSelPS={setSelPS}
                moveStaffCard={moveStaffCard}
                updateStaffCard={updateStaffCard}
                onSetMiguelPhoto={setMiguelPhoto}
              />
            ) : (
              <SnhuBoard
                snhu={state.snhu}
                isLocked={isLocked}
                showToast={showToast}
                weekFilter={weekFilter}
                setWeekFilter={setWeekFilter}
                onOpenAddAssignment={openAddAssignment}
                onOpenAddCourse={openAddCourse}
                onOpenDeleteCourse={openDeleteCourse}
                onChange={(nextSnhu) => {
                  if (isLocked) { showToast("Locked. Unlock to edit."); return; }
                  touchUpdate({ ...state, snhu: nextSnhu });
                }}
              />
            )}

            {toast ? <div className="toast">{toast}</div> : null}

            {unlockModalOpen ? (
              <div className="modalBack" onClick={() => setUnlockModalOpen(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Unlock board?</h3>
                  <div className="modalNote">This enables editing and moving cards.</div>
                  <div className="modalActions">
                    <button onClick={() => setUnlockModalOpen(false)}>Cancel</button>
                    <button className="primary" onClick={unlockNow}>Unlock</button>
                  </div>
                </div>
              </div>
            ) : null}

            {/* Add Course */}
            {addCourseOpen ? (
              <div className="modalBack" onClick={() => setAddCourseOpen(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Add Course</h3>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:10 }}>
                    <input value={cTitle} onChange={(e) => setCTitle(e.target.value)} placeholder="Course name (e.g., BUS 206)" />
                    <select value={cTerm} onChange={(e) => setCTerm(e.target.value)}>
                      <option>Current Term</option>
                      <option>Upcoming Term</option>
                    </select>
                  </div>
                  <div className="modalActions">
                    <button onClick={() => setAddCourseOpen(false)}>Cancel</button>
                    <button className="primary" onClick={saveCourse}>Add</button>
                  </div>
                </div>
              </div>
            ) : null}

            {/* Delete Course */}
            {delCourseOpen ? (
              <div className="modalBack" onClick={() => setDelCourseOpen(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Delete Course</h3>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:10 }}>
                    <select value={delCourseId} onChange={(e) => setDelCourseId(e.target.value)}>
                      {(state.snhu.courses || []).map((c) => (
                        <option key={c.id} value={c.id}>{c.title}</option>
                      ))}
                    </select>
                  </div>
                  <div className="modalActions">
                    <button onClick={() => setDelCourseOpen(false)}>Cancel</button>
                    <button className="dangerBtn smallBtn" onClick={deleteCourseNow}>Delete</button>
                  </div>
                </div>
              </div>
            ) : null}

            {/* Add Assignment */}
            {addAssignOpen ? (
              <div className="modalBack" onClick={() => setAddAssignOpen(false)}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Add Assignment</h3>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:10 }}>
                    <input value={aTitle} onChange={(e) => setATitle(e.target.value)} placeholder="Assignment Title:" />
                    <input value={aCourse} onChange={(e) => setACourse(e.target.value)} placeholder="Course:" />
                    <input value={aTerm} onChange={(e) => setATerm(e.target.value)} placeholder="Term:" />
                    <input type="date" value={aDue} onChange={(e) => setADue(e.target.value)} />
                  </div>
                  <div className="modalActions">
                    <button onClick={() => setAddAssignOpen(false)}>Cancel</button>
                    <button className="primary" onClick={saveAssignment}>Add</button>
                  </div>
                  <div className="modalNote">Assignments appear under the currently selected week.</div>
                </div>
              </div>
            ) : null}
          </div>
        );
      }

      /***********************
       * Amazon Board
       ***********************/
      function AmazonBoard({
        state, isLocked, showToast,
        selStow, setSelStow,
        selPick, setSelPick,
        selLS, setSelLS,
        selPS, setSelPS,
        moveStaffCard, updateStaffCard,
        onSetMiguelPhoto
      }) {
        const [dragOverKey, setDragOverKey] = useState(null);

        function blocked(){ showToast("Locked. Unlock to edit."); }

        function onDragStart(e, cardId){
          if (isLocked){ e.preventDefault(); blocked(); return; }
          e.dataTransfer.setData("text/plain", cardId);
          e.dataTransfer.effectAllowed = "move";
        }

        function allowDrop(e){
          if (isLocked) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        }

        function onDrop(e, bucketKey){
          if (isLocked) return blocked();
          e.preventDefault();
          const cardId = e.dataTransfer.getData("text/plain");
          if (!cardId) return;
          moveStaffCard(cardId, bucketKey);
          setDragOverKey(null);
        }

        // Build buckets
        const buckets = useMemo(() => {
          const m = {};
          // all option buckets + expected
          for (const col of AMAZON_COLS){
            if (col.options) for (const o of col.options) m[o.key] = [];
            if (col.dropKey) m[col.dropKey] = [];
          }
          for (const c of state.staffing.cards || []){
            const k = c.col || "staff_expected";
            (m[k] || (m[k] = [])).push(c);
          }
          return m;
        }, [state.staffing.cards]);

        const countLabel = (n) => (n > 0 ? String(n) : "");
        const photoUrl = (id) => (window.__photoUrlCache && window.__photoUrlCache[id]) ? window.__photoUrlCache[id] : "";

        function renderStaffCard(card){
          const presence = card.presence || "IN";
          const flipped = presence === "OUT";
          const isMiguel = card.id === "staff-migudavc";
          const inputId = `file-${card.id}`;

          return (
            <div
              key={card.id}
              className={"card " + (flipped ? "flipped" : "")}
              draggable={!isLocked}
              onDragStart={(e) => onDragStart(e, card.id)}
              title={isLocked ? "Locked" : "Drag to move"}
            >
              {isMiguel ? (
                <input
                  id={inputId}
                  className="fileInput"
                  type="file"
                  accept="image/*"
                  onChange={(e) => onSetMiguelPhoto(e.target.files && e.target.files[0])}
                  disabled={isLocked}
                />
              ) : null}

              <div className="cardTop">
                <div style={{ display:"flex", gap:10, alignItems:"flex-start" }}>
                  {isMiguel ? (
                    <div className="photoSlot">
                      {photoUrl(card.id) ? (
                        <img src={photoUrl(card.id)} alt="Photo" />
                      ) : (
                        <label className="photoBtn" htmlFor={inputId} title={isLocked ? "Unlock to upload" : "Upload photo"}>
                          Image<br/>Upload
                        </label>
                      )}
                      {/* clickable overlay to change photo */}
                      <label
                        className="photoBtn"
                        htmlFor={inputId}
                        style={{ position:"absolute", inset:0, opacity:0 }}
                        title={isLocked ? "Unlock to change" : "Change photo"}
                      />
                    </div>
                  ) : null}

                  <div>
                    <p className="name">{card.personName} ({card.login})</p>
                    <div className="subline">{card.shiftCoHost} - {card.shiftPattern}</div>

                    <div className="statusRow">
                      <span className={"pill " + (presence === "IN" ? "in" : "out")}>
                        {presence}
                      </span>

                      <select
                        value={presence}
                        disabled={isLocked}
                        onChange={(e) => updateStaffCard(card.id, { presence: e.target.value })}
                        style={{ padding:"6px 10px", fontSize:12, borderRadius:10 }}
                        title="Set employee status"
                      >
                        <option value="IN">IN</option>
                        <option value="OUT">OUT</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div style={{ width:1 }} />
              </div>
            </div>
          );
        }

        // Helpers to render a "selected section" within a column
        function renderSelectedColumn(col, selectedKey, setSelectedKey){
          const selected = (col.options || []).find(o => o.key === selectedKey) || (col.options || [])[0];
          const bucketKey = selected ? selected.key : null;
          const list = bucketKey ? (buckets[bucketKey] || []) : [];

          return (
            <div className="col">
              <div className="colHeader">
                <h2>{col.title}</h2>
                <span>{countLabel(list.length)}</span>
              </div>

              <div className="colToggleWrap">
                <select
                  className="colToggle"
                  value={selectedKey}
                  onChange={(e) => setSelectedKey(e.target.value)}
                  disabled={isLocked}
                  title={`Select ${col.title} section`}
                >
                  {(col.options || []).map((o) => (
                    <option key={o.key} value={o.key}>{o.title}</option>
                  ))}
                </select>
              </div>

              <div className="dropZone">
                <div
                  className={"subsection " + (!isLocked && dragOverKey === bucketKey ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey(bucketKey); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey(bucketKey); }}
                  onDropCapture={(e) => onDrop(e, bucketKey)}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subHeader">
                    <b>{selected ? selected.title : ""}</b>
                    <span>{countLabel(list.length)}</span>
                  </div>
                  <div className="subBody">
                    {list.length === 0 ? <div className="hint"></div> : null}
                    {list.map(renderStaffCard)}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Expected Employee (no subsections)
        const expectedList = buckets["staff_expected"] || [];

        return (
          <div className="board">
            {renderSelectedColumn(AMAZON_COLS[0], selStow, setSelStow)}
            {renderSelectedColumn(AMAZON_COLS[1], selPick, setSelPick)}
            {renderSelectedColumn(AMAZON_COLS[2], selLS, setSelLS)}
            {renderSelectedColumn(AMAZON_COLS[3], selPS, setSelPS)}

            <div className="col">
              <div className="colHeader">
                <h2>{AMAZON_COLS[4].title}</h2>
                <span>{countLabel(expectedList.length)}</span>
              </div>

              <div className="dropZone">
                <div
                  className={"subsection " + (!isLocked && dragOverKey === "staff_expected" ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("staff_expected"); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("staff_expected"); }}
                  onDropCapture={(e) => onDrop(e, "staff_expected")}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subBody">
                    {expectedList.length === 0 ? <div className="hint"></div> : null}
                    {expectedList.map(renderStaffCard)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      /***********************
       * SNHU Board
       ***********************/
      function SnhuBoard({
        snhu, onChange, isLocked, showToast,
        weekFilter, setWeekFilter,
        onOpenAddAssignment,
        onOpenAddCourse,
        onOpenDeleteCourse,
      }) {
        const [dragOverKey, setDragOverKey] = useState(null);
        function blocked(){ showToast("Locked. Unlock to edit."); }

        const courses = snhu.courses || [];
        const assignments = snhu.assignments || [];

        // Buckets for schedule sections
        const courseBuckets = useMemo(() => {
          const m = { current: [], upcoming: [] };
          for (const c of courses){
            const k = (c.termBucket === "Upcoming Term") ? "upcoming" : "current";
            m[k].push(c);
          }
          return m;
        }, [courses]);

        // Filter assignments by current week filter and split by progress
        const asnByProgress = useMemo(() => {
          const m = { ns: [], ip: [] };
          for (const a of assignments){
            if ((a.week || "Week 1") !== weekFilter) continue;
            const p = (a.progress === "In Progress") ? "ip" : "ns";
            m[p].push(a);
          }
          return m;
        }, [assignments, weekFilter]);

        function updateCourse(id, patch){
          if (isLocked) return blocked();
          const next = courses.map(c => (c.id === id ? { ...c, ...patch } : c));
          onChange({ ...snhu, courses: next });
        }

        function updateAssignment(id, patch){
          if (isLocked) return blocked();
          const next = assignments.map(a => (a.id === id ? { ...a, ...patch } : a));
          onChange({ ...snhu, assignments: next });
        }

        function onDragStartCourse(e, id){
          if (isLocked){ e.preventDefault(); blocked(); return; }
          e.dataTransfer.setData("text/plain", "COURSE:" + id);
          e.dataTransfer.effectAllowed = "move";
        }
        function onDragStartAsn(e, id){
          if (isLocked){ e.preventDefault(); blocked(); return; }
          e.dataTransfer.setData("text/plain", "ASN:" + id);
          e.dataTransfer.effectAllowed = "move";
        }
        function allowDrop(e){
          if (isLocked) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        }

        function onDropSchedule(e, bucket){
          if (isLocked) return blocked();
          e.preventDefault();
          const raw = e.dataTransfer.getData("text/plain");
          if (!raw.startsWith("COURSE:")) return;
          const id = raw.slice("COURSE:".length);
          updateCourse(id, { termBucket: bucket === "upcoming" ? "Upcoming Term" : "Current Term" });
          setDragOverKey(null);
        }

        function onDropAssignments(e, progress){
          if (isLocked) return blocked();
          e.preventDefault();
          const raw = e.dataTransfer.getData("text/plain");
          if (!raw.startsWith("ASN:")) return;
          const id = raw.slice("ASN:".length);
          updateAssignment(id, { week: weekFilter, progress: progress === "ip" ? "In Progress" : "Not Started" });
          setDragOverKey(null);
        }

        const countLabel = (n) => (n > 0 ? String(n) : "");
        const fmtDue = (iso) => {
          if (!iso) return "";
          const d = new Date(iso);
          return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
        };

        const renderCourseCard = (c) => (
          <div
            key={c.id}
            className="card"
            draggable={!isLocked}
            onDragStart={(e) => onDragStartCourse(e, c.id)}
            title={isLocked ? "Locked" : "Drag to move"}
          >
            <div className="cardTop">
              <div>
                <p className="courseTitle">{c.title}</p>
                <div className="termLine">{c.termBucket}</div>
              </div>
              <div style={{ width:1 }} />
            </div>
          </div>
        );

        const renderAsnCard = (a) => (
          <div
            key={a.id}
            className="card"
            draggable={!isLocked}
            onDragStart={(e) => onDragStartAsn(e, a.id)}
            title={isLocked ? "Locked" : "Drag to move"}
          >
            <div className="cardTop">
              <div>
                <p className="courseTitle">{a.title}</p>
                <div className="termLine">
                  {(a.course ? a.course + " • " : "")}{a.term}{a.dueDate ? " • Due: " + fmtDue(a.dueDate) : ""}
                </div>

                <div className="assignMetaRow">
                  <select
                    value={WEEK_OPTIONS.includes(a.week) ? a.week : "Week 1"}
                    disabled={isLocked}
                    onChange={(e) => updateAssignment(a.id, { week: e.target.value })}
                    title="Week"
                  >
                    {WEEK_OPTIONS.map(w => <option key={w} value={w}>{w}</option>)}
                  </select>

                  <select
                    value={PROGRESS_OPTIONS.includes(a.progress) ? a.progress : "Not Started"}
                    disabled={isLocked}
                    onChange={(e) => updateAssignment(a.id, { progress: e.target.value })}
                    title="Progress"
                  >
                    {PROGRESS_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>
              <div style={{ width:1 }} />
            </div>
          </div>
        );

        return (
          <div className="board" style={{ gridTemplateColumns: "repeat(2, 1fr)" }}>
            {/* My Class Schedule */}
            <div className="col">
              <div className="colHeader">
                <h2>My Class Schedule</h2>
                <div className="courseActionsRow">
                  <button className="primary smallBtn" onClick={onOpenAddCourse} disabled={isLocked}>Add Course</button>
                  <button className="dangerBtn smallBtn" onClick={onOpenDeleteCourse} disabled={isLocked}>Delete Course</button>
                </div>
              </div>

              <div className="dropZone">
                {/* Current Term section */}
                <div
                  className={"subsection " + (!isLocked && dragOverKey === "sched_current" ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("sched_current"); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("sched_current"); }}
                  onDropCapture={(e) => onDropSchedule(e, "current")}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subHeader">
                    <b>Current Term</b>
                    <span>{countLabel(courseBuckets.current.length)}</span>
                  </div>
                  <div className="subBody">
                    {courseBuckets.current.length === 0 ? <div className="hint"></div> : null}
                    {courseBuckets.current.map(renderCourseCard)}
                  </div>
                </div>

                {/* Upcoming Term section */}
                <div
                  className={"subsection " + (!isLocked && dragOverKey === "sched_upcoming" ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("sched_upcoming"); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("sched_upcoming"); }}
                  onDropCapture={(e) => onDropSchedule(e, "upcoming")}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subHeader">
                    <b>Upcoming Term</b>
                    <span>{countLabel(courseBuckets.upcoming.length)}</span>
                  </div>
                  <div className="subBody">
                    {courseBuckets.upcoming.length === 0 ? <div className="hint"></div> : null}
                    {courseBuckets.upcoming.map(renderCourseCard)}
                  </div>
                </div>
              </div>
            </div>

            {/* Current Assignments */}
            <div className="col">
              <div className="colHeader">
                <h2>Current Assignments</h2>
                <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                  <button className="primary smallBtn" onClick={onOpenAddAssignment} disabled={isLocked}>Add Assignment</button>
                </div>
              </div>

              {/* Week select toggle below column header (like board toggle) */}
              <div className="colToggleWrap">
                <select
                  className="colToggle"
                  value={weekFilter}
                  onChange={(e) => setWeekFilter(e.target.value)}
                  disabled={isLocked}
                  title="Select week"
                >
                  {WEEK_OPTIONS.map(w => <option key={w} value={w}>{w}</option>)}
                </select>
              </div>

              <div className="dropZone">
                {/* Not Started */}
                <div
                  className={"subsection " + (!isLocked && dragOverKey === "asn_ns" ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("asn_ns"); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("asn_ns"); }}
                  onDropCapture={(e) => onDropAssignments(e, "ns")}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subHeader">
                    <b>Not Started</b>
                    <span>{countLabel(asnByProgress.ns.length)}</span>
                  </div>
                  <div className="subBody">
                    {asnByProgress.ns.length === 0 ? <div className="hint"></div> : null}
                    {asnByProgress.ns.map(renderAsnCard)}
                  </div>
                </div>

                {/* In Progress */}
                <div
                  className={"subsection " + (!isLocked && dragOverKey === "asn_ip" ? "dragOver" : "")}
                  onDragOverCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("asn_ip"); }}
                  onDragEnterCapture={(e) => { allowDrop(e); if (!isLocked) setDragOverKey("asn_ip"); }}
                  onDropCapture={(e) => onDropAssignments(e, "ip")}
                  onDragLeave={() => setDragOverKey(null)}
                >
                  <div className="subHeader">
                    <b>In Progress</b>
                    <span>{countLabel(asnByProgress.ip.length)}</span>
                  </div>
                  <div className="subBody">
                    {asnByProgress.ip.length === 0 ? <div className="hint"></div> : null}
                    {asnByProgress.ip.map(renderAsnCard)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
